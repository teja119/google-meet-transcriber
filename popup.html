<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Meet Transcriber</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 300px;
      padding: 12px;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px;
    }
    label {
      font-size: 12px;
      color: #333;
      display: block;
      margin-bottom: 4px;
    }
    select, input[type="password"] {
      width: 100%;
      padding: 5px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-bottom: 6px;
      cursor: pointer;
    }
    #status {
      font-size: 12px;
      color: #555;
      margin: 6px 0;
      min-height: 32px;
      white-space: pre-wrap;
    }
    details {
      margin-bottom: 10px;
      font-size: 12px;
    }
    summary {
      cursor: pointer;
      color: #333;
      margin-bottom: 6px;
    }
    #summaryResult {
      font-size: 12px;
      white-space: pre-wrap;
      max-height: 220px;
      overflow-y: auto;
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px;
      margin-top: 6px;
      display: none;
    }
    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>Meet Transcriber</h1>

  <label for="targetLang">Translate captions to</label>
  <select id="targetLang">
    <option value="">Don't translate (original only)</option>
  </select>

  <button id="startCapture">Start Capture</button>
  <button id="stopCapture">Stop &amp; Download</button>
  <div id="status"></div>

  <hr />

  <details id="settingsDetails">
    <summary>Groq API key (for Speaker-wise Summary)</summary>
    <label for="groqKey">Groq API key</label>
    <input type="password" id="groqKey" placeholder="gsk_..." />
    <button id="saveKey">Save key</button>
    <div style="color:#777; margin-top:4px;">
      Get a free key at
      <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>.
      Stored only in this browser.
    </div>
  </details>

  <button id="summarize">Summarize by Speaker</button>
  <div id="summaryResult"></div>
  <button id="downloadSummary" style="display:none;">Download Summary</button>

  <script src="popup.js"></script>
</body>
</html>
